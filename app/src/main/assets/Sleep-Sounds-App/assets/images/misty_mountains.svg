<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071224"/>
      <stop offset="55%" stop-color="#112742"/>
      <stop offset="100%" stop-color="#1b3a4b"/>
    </linearGradient>
    <linearGradient id="mistBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90c5c7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#90c5c7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#90c5c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- Moon -->
  <circle cx="1180" cy="210" r="56" fill="#e8f3f1" opacity="0.88"/>
  <circle cx="1180" cy="210" r="135" fill="#77b8b0" opacity="0.12"/>
