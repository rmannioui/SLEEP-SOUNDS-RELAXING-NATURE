<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071726"/>
      <stop offset="50%" stop-color="#0d2a33"/>
      <stop offset="100%" stop-color="#071b22"/>
    </linearGradient>
    <linearGradient id="falls" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fe0d6" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#58b0a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9f3ec" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#b7ece3" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#3c877c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#071b22" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- Moonlit canopy light -->
  <circle cx="800" cy="180" r="240" fill="#5fb49c" opacity="0.14"/>
  <circle cx="800" cy="160" r="110" fill="#a8e2cf" opacity="0.16"/>
  <!-- Cliff walls -->
  <path d="M0 120 L580 180 L610 740 L0 740 Z" fill="#091f28"/>
  <path d="M1600 100 L1020 175 L990 740 L1600 740 Z" fill="#0a222b"/>
  <!-- Lush foliage -->
  <g fill="#0e3433">
    <ellipse cx="260" cy="210" rx="220" ry="120"/>
    <ellipse cx="460" cy="240" rx="160" ry="95"/>
    <ellipse cx="1340" cy="190" rx="230" ry="130"/>
    <ellipse cx="1120" cy="235" rx="160" ry="90"/>
  </g>
  <!-- Waterfall stream -->
  <path d="M645 180 C665 360 640 540 620 735 L980 735 C955 540 930 360 955 175 Z" fill="url(#falls)"/>
  <g stroke="#e0faf6" stroke-linecap="round" opacity="0.45">
    <line x1="700" y1="210" x2="685" y2="680" stroke-width="6"/>
    <line x1="775" y1="190" x2="770" y2="700" stroke-width="9"/>
    <line x1="845" y1="205" x2="852" y2="690" stroke-width="5"/>
    <line x1="905" y1="220" x2="922" y2="680" stroke-width="4"/>
  </g>
  <!-- Lagoon & ripples -->
  <rect x="0" y="720" width="1600" height="180" fill="#08242c"/>
  <ellipse cx="800" cy="735" rx="520" ry="95" fill="url(#mist)"/>
  <g fill="none" stroke="#9ee0d5" stroke-opacity="0.28" stroke-width="2">
    <ellipse cx="800" cy="785" rx="260" ry="26"/>
    <ellipse cx="800" cy="795" rx="400" ry="40"/>
  </g>
</svg>
