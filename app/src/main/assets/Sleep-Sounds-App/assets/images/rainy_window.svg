<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="60%" stop-color="#0e2238"/>
      <stop offset="100%" stop-color="#132d3c"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="72%" cy="68%" r="42%">
      <stop offset="0%" stop-color="#f2b86d" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#538b83" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#071120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8ab8d0" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#091727" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1150" cy="610" r="380" fill="url(#lampGlow)"/>
  <!-- Distant city / tree silhouettes outside window -->
  <path d="M0 720 Q220 630 420 690 T860 660 T1300 700 L1600 670 L1600 900 L0 900 Z" fill="#081623"/>
  <g fill="#0c2030" opacity="0.85">
    <ellipse cx="320" cy="700" rx="140" ry="70"/>
    <ellipse cx="520" cy="690" rx="110" ry="90"/>
    <ellipse cx="1040" cy="685" rx="160" ry="85"/>
    <ellipse cx="1280" cy="710" rx="150" ry="70"/>
  </g>
  <!-- Soft bokeh lights in night rain -->
  <circle cx="290" cy="540" r="24" fill="#6ab59f" opacity="0.18"/>
  <circle cx="480" cy="590" r="16" fill="#e8b878" opacity="0.22"/>
  <circle cx="960" cy="510" r="28" fill="#7fc8b6" opacity="0.14"/>
  <circle cx="1160" cy="560" r="34" fill="#f3c57a" opacity="0.25"/>
  <circle cx="1270" cy="610" r="18" fill="#f3c57a" opacity="0.2"/>
  <!-- Rain streaks -->
  <g stroke="#a6d6ea" stroke-linecap="round" opacity="0.26">
    <line x1="160" y1="90" x2="135" y2="210" stroke-width="2"/>
    <line x1="340" y1="150" x2="310" y2="300" stroke-width="2.5"/>
    <line x1="560" y1="60" x2="532" y2="205" stroke-width="2"/>
    <line x1="740" y1="220" x2="712" y2="380" stroke-width="2"/>
    <line x1="920" y1="110" x2="890" y2="270" stroke-width="2.5"/>
    <line x1="1120" y1="180" x2="1095" y2="320" stroke-width="2"/>
    <line x1="1380" y1="100" x2="1352" y2="260" stroke-width="2"/>
    <line x1="250" y1="360" x2="225" y2="520" stroke-width="2"/>
    <line x1="650" y1="420" x2="625" y2="570" stroke-width="2.5"/>
    <line x1="1040" y1="390" x2="1015" y2="540" stroke-width="2"/>
    <line x1="1450" y1="360" x2="1420" y2="510" stroke-width="2.5"/>
  </g>
  <!-- Water droplets on glass -->
  <g fill="#bfe6f6" opacity="0.45">
    <circle cx="260" cy="240" r="4"/><circle cx="264" cy="295" r="2.5"/>
    <circle cx="445" cy="360" r="5"/><circle cx="620" cy="210" r="3.5"/>
    <circle cx="880" cy="330" r="4.5"/><circle cx="1010" cy="245" r="3"/>
    <circle cx="1220" cy="380" r="5"/><circle cx="1390" cy="290" r="3.5"/>
  </g>
  <!-- Window panes & sill -->
  <rect width="1600" height="900" fill="url(#glass)"/>
  <rect x="0" y="0" width="1600" height="36" fill="#060e18"/>
  <rect x="0" y="810" width="1600" height="90" fill="#07111c"/>
  <rect x="0" y="0" width="52" height="900" fill="#060e18"/>
  <rect x="1548" y="0" width="52" height="900" fill="#060e18"/>
  <rect x="786" y="0" width="28" height="820" fill="#081320"/>
  <rect x="0" y="425" width="1600" height="22" fill="#081320"/>
</svg>
